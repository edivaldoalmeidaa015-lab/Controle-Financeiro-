<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Turbinas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#014e77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turbinas">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="description" content="Ordens de manutenção dos aerogeradores: peças, materiais, falhas, custos e mapa de turbinas, com filtros e segmentação.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M16 17 L16 29 M16 17 L9 6 M16 17 L27 13 M16 17 L8 22' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='17' r='2.6' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f3f3f0;
  --surface: #fcfcfb;
  --surface-2: #f6f6f3;
  --hover: rgba(11, 11, 11, .045);
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7a7974;
  --grid: #e7e6e0;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, .10);
  --empty: #ecebe6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --neutral: #b9b8b1;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --critical-ink: #b42a2a;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, .10);
  --shadow: 0 1px 2px rgba(11, 11, 11, .04), 0 1px 1px rgba(11, 11, 11, .02);
  --shadow-pop: 0 12px 32px rgba(11, 11, 11, .14), 0 2px 6px rgba(11, 11, 11, .06);
  --rail: #14233a;
  --rail-ink: #c9d6e8;
  --rail-active: #ffffff;
  --titulo-marca: #014e77;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --hover: rgba(255, 255, 255, .06);
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8e88; --grid: #2c2c2a; --axis: #45453f;
    --border: rgba(255, 255, 255, .10); --empty: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --neutral: #5d5c57; --good-ink: #0ca30c; --critical-ink: #e66767;
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, .16);
    --shadow: none; --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5);
    --rail: #111a26; --rail-ink: #9fb0c6;
    --titulo-marca: #5cc4e0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --hover: rgba(255, 255, 255, .06);
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8e88; --grid: #2c2c2a; --axis: #45453f;
  --border: rgba(255, 255, 255, .10); --empty: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --neutral: #5d5c57; --good-ink: #0ca30c; --critical-ink: #e66767;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, .16);
  --shadow: none; --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5);
  --rail: #111a26; --rail-ink: #9fb0c6;
  --titulo-marca: #5cc4e0;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--rail) 76px, transparent 76px); }
.rail {
  background: var(--rail); color: var(--rail-ink);
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; align-items: stretch; padding: 12px 8px; gap: 4px;
}
.rail .marca { display: grid; place-items: center; height: 44px; margin-bottom: 10px; }
.rail .marca svg, .rail .marca img { width: 34px; height: 34px; display: block; }
.topo .marca-topo { width: 42px; height: 42px; flex-shrink: 0; display: block; }
.topo .logo-completo { flex-shrink: 0; display: block; border-right: 1px solid var(--border); padding-right: 16px; margin-right: 2px; }
.topo .logo-completo img { height: 46px; width: auto; display: block; background: #fff; border-radius: 8px; padding: 3px 8px; }
.topo .marca-topo.so-celular { display: none; }
/* celular: a logo completa vai numa linha própria, em cima do título */
@media (max-width: 860px) { .topo .logo-completo { flex-basis: 100%; border-right: 0; padding-right: 0; margin: 0 0 -4px; } .topo .logo-completo img { height: 36px; } }
.topo .titulo { flex: 1 1 0; min-width: 0; }
.topo.com-marca h1 { color: var(--titulo-marca); }
.nav-btn {
  border: 0; background: transparent; color: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 2px; border-radius: 8px; font-size: 11px; font-weight: 550; letter-spacing: .01em;
  position: relative;
}
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-btn[aria-current="page"] { background: rgba(255, 255, 255, .12); color: var(--rail-active); }
.nav-btn[aria-current="page"]::before {
  content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: #6da7ec;
}
.rail .rodape { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topo {
  display: flex; align-items: center; gap: 16px; padding: 14px 24px 10px;
}
.topo h1 { font-size: 19px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.topo .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 550; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.prim { background: var(--accent); border-color: transparent; color: #fff; }
.btn.prim:hover { filter: brightness(1.06); }
[hidden] { display: none !important; }
.btn.icone { padding: 7px; }
.aviso-base {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300;
  max-width: min(560px, calc(100vw - 32px)); display: flex; gap: 10px; align-items: flex-start;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.4; box-shadow: 0 8px 28px rgba(0,0,0,.18);
}
.aviso-base.ok { border-left-color: var(--good, #2e8540); }
.aviso-base.erro { border-left-color: var(--critical, #c0392b); }
.aviso-base.alerta { border-left-color: var(--warning, #d98c00); }
.aviso-base .fechar { margin-left: auto; border: 0; background: none; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 0 2px; }
.aviso-base .giro { width: 16px; height: 16px; flex: none; margin-top: 2px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }

/* ---------- barra de filtros (slicers) ---------- */
.filtros {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(8px);
  padding: 8px 24px 10px; border-bottom: 1px solid var(--border);
}
.filtros .linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.slicer {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  min-width: 104px; max-width: 176px; padding: 5px 28px 6px 10px; position: relative;
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; text-align: left;
  box-shadow: var(--shadow);
}
.slicer:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.slicer .rot { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.slicer .val { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slicer::after {
  content: ""; position: absolute; right: 11px; top: 50%; width: 7px; height: 7px; margin-top: -5px;
  border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg);
}
.slicer.ativo { border-color: var(--accent); background: var(--accent-wash); }
.slicer.ativo .val { color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 3px; gap: 2px; box-shadow: var(--shadow); align-items: stretch; }
.seg .rot { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); align-self: center; padding: 0 6px 0 7px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 550; color: var(--ink-2); }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.limpar { border: 0; background: transparent; color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 0 6px; align-self: center; }
.limpar:hover { text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 4px 3px 10px;
  background: var(--accent-wash); color: var(--accent-ink); font-size: 12px; font-weight: 550; border: 0;
}
.chip b { font-weight: 650; }
.chip span.x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; }
.chip:hover span.x { background: color-mix(in srgb, var(--accent) 20%, transparent); }

/* popover */
.pop {
  position: fixed; z-index: 60; width: 300px; max-height: min(460px, 70vh);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; overflow: hidden;
}
.pop .busca { padding: 10px 10px 6px; }
.pop input[type="search"], .campo {
  width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 7px 10px; font-size: 13px;
}
.pop .acoes-pop { display: flex; justify-content: space-between; padding: 2px 12px 6px; font-size: 12px; }
.pop .acoes-pop button { border: 0; background: none; color: var(--accent-ink); font-weight: 600; padding: 2px 0; }
.pop .lista { overflow: auto; padding: 0 6px 8px; }
.opc {
  display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%;
  border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 13px;
}
.opc:hover { background: var(--hover); }
.opc .cx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--axis); display: grid; place-items: center; }
.pop .dica { padding: 0 12px 6px; font-size: 11.5px; color: var(--muted); }
.opc[aria-checked="true"] .cx { background: var(--accent); border-color: var(--accent); }
.opc[aria-checked="true"] .cx::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.opc .qt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.opc.zero { color: var(--muted); }
.opc.grupo-tit { display: block; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 8px 4px; cursor: default; }
.opc.grupo-tit:hover { background: none; }
.periodo-opc { grid-template-columns: 18px 1fr auto; }
.periodo-opc .ck { width: 16px; height: 16px; display: grid; place-items: center; }
.periodo-opc[aria-checked="true"] .ck::after { content: ""; width: 5px; height: 10px; border: solid var(--accent); border-width: 0 2.5px 2.5px 0; transform: translateY(-2px) rotate(45deg); }
.periodo-opc[aria-checked="true"] { font-weight: 650; }
.pop .rodape-pop { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
.pop .rodape-pop label { display: flex; flex-direction: column; gap: 4px; }

/* ---------- página ---------- */
.pagina { padding: 18px 24px 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-content: start; }
.pagina.carregando { opacity: .55; transition: opacity .15s; }
.titulo-pag { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: -4px; }
.titulo-pag h2 { margin: 0; font-size: 16px; font-weight: 650; }
.titulo-pag p { margin: 0; color: var(--ink-2); font-size: 13px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.faixa-aviso { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--warning); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.45; color: var(--ink); }
.faixa-aviso > span { flex: 1 1 260px; }
.kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 16px 18px 18px; min-width: 0; display: flex; flex-direction: column;
}
.card-h { display: flex; align-items: flex-start; gap: 8px 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h .tt { flex: 1 1 220px; }
.card-h .tt { min-width: 0; }
.card-h h3 { margin: 0; font-size: 14px; font-weight: 650; }
.card-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
.card-h .ferr { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.mini-btn {
  border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 6px;
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 550;
}
.mini-btn:hover { background: var(--hover); color: var(--ink); }
.mini-btn[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-wash); }
.mini-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
select.mini {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 4px 8px; font-size: 12.5px; font-weight: 550;
}
.card-b { min-width: 0; flex: 1; position: relative; }
.vazio { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }
.nota { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* KPI */
.kpi { padding: 14px 16px 14px; gap: 0; position: relative; }
.kpi .k-rot { font-size: 12.5px; color: var(--ink-2); font-weight: 550; display: flex; align-items: center; gap: 6px; }
.kpi .k-val { font-size: 27px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; }
.kpi .k-val small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .k-spark { position: absolute; right: 14px; top: 44px; opacity: .95; }
.st { display: inline-flex; align-items: flex-start; gap: 4px; font-weight: 600; font-size: 12px; }
.st svg { margin-top: 1px; }
.st svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.st.bom { color: var(--good-ink); } .st.ruim { color: var(--critical-ink); } .st.alerta { color: #a96b00; }
:root[data-theme="dark"] .st.alerta { color: var(--warning); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st.alerta { color: var(--warning); } }

/* barras horizontais */
.bh { display: flex; flex-direction: column; gap: 2px; }
.bh-row {
  display: grid; grid-template-columns: minmax(84px, var(--rot, 38%)) minmax(0, 1fr) minmax(44px, var(--val, auto)); align-items: center; gap: 10px;
  border: 0; background: transparent; text-align: left; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; width: calc(100% + 12px);
}
button.bh-row:hover, .bh-row.foco { background: var(--hover); }
.bh-lab { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.bh-lab small { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.bh-track { height: 14px; display: flex; gap: 2px; }
.bh-bar { height: 100%; border-radius: 0 4px 4px 0; min-width: 0; transition: width .25s ease; }
.bh-track .bh-bar + .bh-bar { border-radius: 0; }
.bh-track .bh-bar:last-child { border-radius: 0 4px 4px 0; }
.bh-track .bh-bar:only-child { border-radius: 0 4px 4px 0; }
.bh-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 44px; white-space: nowrap; }
.bh-val small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.bh-row.dim .bh-bar { opacity: .28; }
.bh-row.dim .bh-lab, .bh-row.dim .bh-val { color: var(--muted); }
.bh-row.sel .bh-lab { font-weight: 650; }

.legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: -2px 0 10px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legenda i.linha { height: 2px; width: 14px; border-radius: 1px; }

/* svg */
svg text { font-family: inherit; }
.eixo { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.grade { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.rot-dir { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
.rot-ponto { font-size: 12px; font-weight: 700; fill: var(--ink); stroke: var(--surface); stroke-width: 3px; paint-order: stroke; font-variant-numeric: tabular-nums; }
.grafico svg { display: block; overflow: visible; }
.grafico:focus-visible { outline-offset: 4px; }

/* mapa de calor */
.hm { display: grid; gap: 3px; align-items: center; }
.hm .hm-col { font-size: 10.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.hm-lin { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding-right: 8px; border: 0; background: none; text-align: left; border-radius: 6px; }
.hm-lin:hover { color: var(--accent-ink); }
.hm-lin.sel { color: var(--accent-ink); }
.cel {
  aspect-ratio: 1 / 1; border: 0; border-radius: 4px; padding: 0; display: grid; place-items: center;
  font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; position: relative; transition: transform .08s;
}

  var st = M.parques.map(function () { return { oms: 0, corr: 0 }; });

/** Baixa um CSV (separador ;, com BOM para o Excel abrir com acento). */
function baixarCSV(nome, cab, linhas) {
  var esc = function (v) { v = v === null || v === undefined ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var txt = [cab.map(esc).join(';')].concat(linhas.map(function (l) { return l.map(esc).join(';'); })).join('\r\n');
  var blob = new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' });
  var a = h('a', { href: URL.createObjectURL(blob), download: nome });
  document.body.append(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* =====================================================================
   Detalhe da turbina (drawer) e da OM (modal)
   ===================================================================== */
// Janelas (detalhe da turbina, ficha da OM) ficam empilhadas: fechar uma revela a de baixo.
// Cada janela registra um passo no histórico, então o "voltar" do celular fecha a janela
// em vez de sair do painel.
var pilha = [], ignorarPop = 0;
function topo() { return pilha[pilha.length - 1] || null; }
function fecharCamada() {
  if (!pilha.length) return;
  var t = topo();
  if (t.noHistorico && history.state && history.state.camada === pilha.length) {
    try { history.back(); return; } catch (e) { /* histórico bloqueado: fecha direto */ }
  }
  removerTopo();
}
function removerTopo() {
  var c = pilha.pop();
  if (!c) return;
  c.veu.classList.remove('on'); c.painel.classList.remove('on');
  setTimeout(function () { c.veu.remove(); c.painel.remove(); }, 220);
  if (c.aoFechar) c.aoFechar();
  if (c.foco && c.foco.focus && document.body.contains(c.foco)) c.foco.focus({ preventScroll: true });
}
window.addEventListener('popstate', function () {
  var nivel = history.state && history.state.camada || 0;
  while (pilha.length > nivel) removerTopo();
});
document.addEventListener('keydown', function (ev) {
  var t = topo();
  if (!t) return;
  if (ev.key === 'Escape') { ev.preventDefault(); fecharCamada(); }
  else if (t.navegar && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    ev.preventDefault(); t.navegar(ev.key === 'ArrowRight' ? 1 : -1);
  }
});
function abrirCamada(painel, opcoes) {
  opcoes = opcoes || {};
  var foco = document.activeElement;
  var veu = h('div', { class: 'veu', onclick: fecharCamada });
  veu.style.zIndex = 70 + pilha.length * 10; painel.style.zIndex = 75 + pilha.length * 10;
  document.body.append(veu, painel);
  var c = { veu: veu, painel: painel, foco: foco, aoFechar: opcoes.aoFechar, navegar: opcoes.navegar };
  pilha.push(c);
  // Leitores de arquivo do celular (content://) bloqueiam o histórico; aí a janela só não cria o passo do "voltar".
  try { history.pushState({ camada: pilha.length }, '', location.href); c.noHistorico = true; } catch (e) { c.noHistorico = false; }
  requestAnimationFrame(function () { veu.classList.add('on'); painel.classList.add('on'); });
  var f = painel.querySelector('[data-foco]') || painel.querySelector('button'); if (f) f.focus({ preventScroll: true });
  return c;
}

/**
 * O Manusis exporta a planilha dentro de um .zip. Se o arquivo for um zip que não é ele mesmo
 * uma planilha (o .xlsx também é zip, mas tem [Content_Types].xml), devolve as planilhas .xlsx de dentro.
 */
function planilhasDoZip(buf) {
  var u = new Uint8Array(buf), dv = new DataView(buf);
  if (u.length < 22 || u[0] !== 0x50 || u[1] !== 0x4b) return Promise.resolve([buf]);
  // fim do diretório central (procura de trás para frente; o comentário do zip tem até 64 KB)
  var fim = -1;
  for (var p = u.length - 22; p >= Math.max(0, u.length - 65557); p--) if (dv.getUint32(p, true) === 0x06054b50) { fim = p; break; }
  if (fim < 0) return Promise.resolve([buf]);
  var n = dv.getUint16(fim + 10, true), q = dv.getUint32(fim + 16, true), dec = new TextDecoder();
  var entradas = [];
  for (var k = 0; k < n && dv.getUint32(q, true) === 0x02014b50; k++) {
    var lNome = dv.getUint16(q + 28, true), lExtra = dv.getUint16(q + 30, true), lCom = dv.getUint16(q + 32, true);
    entradas.push({ nome: dec.decode(u.subarray(q + 46, q + 46 + lNome)), metodo: dv.getUint16(q + 10, true),
      tam: dv.getUint32(q + 20, true), local: dv.getUint32(q + 42, true) });
    q += 46 + lNome + lExtra + lCom;
  }
  if (entradas.some(function (e) { return e.nome === '[Content_Types].xml'; })) return Promise.resolve([buf]); // já é a planilha
  var xs = entradas.filter(function (e) { return /\.xlsx$/i.test(e.nome) && !/(^|\/)(__MACOSX|\.)/.test(e.nome); });
  if (!xs.length) return Promise.reject(new Error('O arquivo .zip não tem nenhuma planilha .xlsx dentro.'));
  return Promise.all(xs.map(function (x) {
    var ini = x.local + 30 + dv.getUint16(x.local + 26, true) + dv.getUint16(x.local + 28, true);
    var dados = u.subarray(ini, ini + x.tam);
    if (x.metodo === 0) return dados.slice().buffer;
    if (x.metodo !== 8 || typeof DecompressionStream === 'undefined')
      return Promise.reject(new Error('Não consegui abrir o .zip neste aparelho. Extraia a planilha .xlsx e escolha ela.'));
    return new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  }));
}

      req.onerror = function () { ok(null); };
    });
  }).catch(function () { return null; });
  var limite = new Promise(function (ok) { setTimeout(function () { ok(null); }, 2500); });
  return Promise.race([doBanco, limite]).then(function (b) { return maisRecente(b, doLocal); });
}
function guardarBase(modelo) {
  return abrirBanco().then(function (db) {
    return new Promise(function (ok, erro) {
      var tx = db.transaction('base', 'readwrite');
      tx.objectStore('base').put(modelo, 'atual');
      tx.oncomplete = function () { ok(); };
      tx.onerror = tx.onabort = function () { erro(tx.error); };
    });
  }).then(function () {
    try { localStorage.removeItem(CHAVE_BASE); } catch (e) { /* nada a limpar */ }
    return true;
  }).catch(function () {
    try { localStorage.setItem(CHAVE_BASE, JSON.stringify(modelo)); return true; } catch (e) { return false; }
  });
}
function maisRecente(a, b) {
  if (!a) return b || null;
  if (!b) return a;
  return (a.gerado || '') >= (b.gerado || '') ? a : b;
}

/**
 * Lê uma ou mais planilhas (ou .zip com elas): a exportação de OMs (Manusis ou Base Power BI) e,
 * opcional, o consumo de materiais do Manusis, que se liga às OMs pelo número.
 */
function lerArquivo(arquivos, aoErro) {
  arquivos = Array.prototype.slice.call(arquivos.length !== undefined ? arquivos : [arquivos]);
  // imagem = logo da empresa
  var ehImagem = function (a) { return /^image\//.test(a.type || '') || /\.(png|jpe?g|webp|svg)$/i.test(a.name || ''); };
  var imagens = arquivos.filter(ehImagem);
  arquivos = arquivos.filter(function (a) { return !ehImagem(a); });
  if (imagens.length) {
    aplicarLogo(imagens[0]).then(function () {
      if (M) montarApp();
      if (!arquivos.length) avisar('✅ Logo aplicada. Ela fica guardada neste aparelho.', 'ok');
    }, function (e) { avisar('❌ ' + e.message, 'erro', true); });
    if (!arquivos.length) return;
  }
  var nomes = arquivos.map(function (a) { return '“' + a.name + '”'; }).join(' e ');
  avisar('Lendo ' + nomes + '… Pode levar alguns segundos.', 'info', true);
  // deixa o aviso aparecer antes do processamento pesado
  new Promise(function (ok) { setTimeout(ok, 60); })
    .then(carregarSheetJS)
    .then(function (XLSX) {
      return Promise.all(arquivos.map(function (a) {
        return lerBytes(a).then(planilhasDoZip).then(function (bufs) {
          return bufs.map(function (buf) {
            try { return XLSX.read(buf, { type: 'array' }); }
            catch (e) { throw new Error('Não consegui abrir “' + a.name + '” como planilha do Excel (.xlsx).'); }
          });
        });
      })).then(function (listas) {
        var wbs = [].concat.apply([], listas);
        // a mesma planilha pode trazer as ordens e o consumo (base única do painel)
        var deOMs = wbs.filter(function (wb) { return ModeloTurbinas.temOrdens(wb) || !ModeloTurbinas.temConsumo(wb); });
        var deConsumo = wbs.filter(function (wb) { return ModeloTurbinas.temConsumo(wb); });
        var modelo = deOMs.length ? ModeloTurbinas.montar(deOMs[deOMs.length - 1], XLSX) : M;
        if (!modelo) throw new Error('Carregue primeiro a exportação de OMs do Manusis; o consumo de materiais se liga a ela pelo número da OM.');
        if (deOMs.length && M && M.consumo && !deConsumo.length && modelo.fonte === 'manusis') {
          // base de OMs nova: o consumo já carregado continua valendo para as OMs que ele cita
          modelo.ordens.custoOM = modelo.ordens.custoTot.slice();
          modelo.consumo = M.consumo; ModeloTurbinas.aplicarConsumo(modelo);
        }
        var stats = null;
        if (deConsumo.length) {
          if (modelo.fonte !== 'manusis') throw new Error('O consumo de materiais só se liga à exportação de OMs do Manusis. Carregue as duas planilhas.');
          stats = ModeloTurbinas.juntarConsumo(modelo, deConsumo[deConsumo.length - 1], XLSX);
        }
        modelo.gerado = new Date().toISOString();
        var uriLogo = wbs.map(logoDaPlanilha).filter(Boolean)[0];
        var logoPronta = uriLogo ? aplicarLogoUrl(uriLogo).catch(function () { /* segue sem logo */ }) : Promise.resolve();
        return logoPronta.then(function () { return guardarBase(modelo); }).then(function (guardou) {
          fecharTodasCamadas();
          try { location.hash = ''; } catch (e) { /* sem histórico */ }
          iniciar(modelo);
          window.scrollTo(0, 0);
          var msg = '✅ Base atualizada: ' + fInt(N) + ' OMs, dados até ' + fData(diaMax) + '.';
          if (stats) msg += ' Consumo de materiais: ' + fInt(stats.linhas) + ' baixas em ' + fInt(stats.oms) + ' OMs' +
            (stats.fora ? ' (' + fInt(stats.fora) + ' OMs do consumo não estão na base de OMs — puxe as duas do mesmo período).' : ', todas ligadas à base.');
          else if (modelo.consumo) msg += ' O consumo de materiais carregado antes continua ligado.';
          if (guardou) avisar(msg, stats && stats.fora ? 'alerta' : 'ok', !!stats);
          else avisar(msg + ' Atenção: este aplicativo não guarda dados — ao fechar, volta a base anterior. Abra o painel pelo Chrome para manter a atualização.', 'alerta', true);
        });
      });
    })
    .catch(function (e) {
      var msg = '❌ A base não foi atualizada. ' + (e && e.message || String(e));
      avisar(msg, 'erro', true);
      if (aoErro) aoErro(msg);
    });
}

function fecharTodasCamadas() { while (pilha.length) removerTopo(); }

function escolherArquivo() {
  var antigo = document.getElementById('escolher-base');
  if (antigo) antigo.remove();
  // Alguns aplicativos de celular ignoram um seletor de arquivo que não está na página.
  var inp = h('input', { type: 'file', id: 'escolher-base', multiple: true, accept: '.xlsx,.xlsm,.xls,.zip,.png,.jpg,.jpeg,.webp,.svg,image/*,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/zip,application/x-zip-compressed', style: 'position:fixed;left:-9999px;opacity:0' });
  inp.addEventListener('change', function () { var fs = inp.files && Array.prototype.slice.call(inp.files); inp.remove(); if (fs && fs.length) lerArquivo(fs); });
  document.body.append(inp);
  inp.click();
}

function telaCarga(msgErro) {
  var raiz = document.getElementById('raiz');
  raiz.textContent = '';
  var erro = h('div', { class: 'erro', role: 'alert' }, msgErro || '');
  var drop = h('div', { class: 'drop' },
    (function () { var l = logo(); l.setAttribute('class', 'logo'); return l; })(),
    h('h1', null, 'Painel de Turbinas'),
    h('p', null, 'Arraste aqui a planilha “Base_PowerBI_Ordens” (.xlsx) ou escolha o arquivo. Os dados são lidos apenas no seu navegador — nada é enviado.'),
    h('button', { class: 'btn prim', type: 'button', onclick: escolherArquivo }, icone('enviar'), 'Escolher planilha'),
    erro);
  ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.add('sobre'); }); });
  ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.remove('sobre'); }); });
  drop.addEventListener('drop', function (ev) {
    var fs = Array.prototype.slice.call(ev.dataTransfer.files || []);
    if (fs.length) { erro.textContent = 'Lendo planilha…'; lerArquivo(fs, function (m) { erro.textContent = m; }); }
  });
  raiz.append(h('div', { class: 'boas-vindas' }, drop));
}

function telaErro(e) {
  var raiz = document.getElementById('raiz');
  if (!raiz) return;
  raiz.textContent = '';
  raiz.append(h('div', { class: 'boas-vindas' }, h('div', { class: 'drop' },
    h('h1', null, 'Painel de Turbinas'),
    h('p', null, 'O painel não conseguiu abrir neste aplicativo. Abra o arquivo pelo Google Chrome (Downloads → toque no arquivo → Abrir com → Chrome).'),
    h('div', { class: 'erro', role: 'alert' }, 'Detalhe técnico: ' + (e && e.message || String(e))))));
}

(function () {
  try { iniciarPainel(); } catch (e) { telaErro(e); }
})();
/* =====================================================================
   Aplicativo instalável (ícone na tela inicial, abre sem internet)
   ===================================================================== */
var pedidoInstalar = null;
function modoApp() { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function botaoInstalar() {
  var b = h('button', { class: 'btn instalar', type: 'button', id: 'btn-instalar', title: 'Instalar o painel como aplicativo', onclick: instalarApp, hidden: true },
    icone('baixar'), h('span', { class: 'txt' }, 'Instalar app'));
  if (pedidoInstalar && !modoApp()) b.hidden = false;
  return b;
}
function instalarApp() {
  if (!pedidoInstalar) return;
  pedidoInstalar.prompt();
  pedidoInstalar.userChoice.then(function (r) {
    if (r.outcome === 'accepted') avisar('✅ Aplicativo instalado! Procure o ícone “Turbinas” na tela inicial.', 'ok');
    pedidoInstalar = null;
    var b = document.getElementById('btn-instalar'); if (b) b.hidden = true;
  });
}
window.addEventListener('beforeinstallprompt', function (ev) {
  ev.preventDefault(); pedidoInstalar = ev;
  var b = document.getElementById('btn-instalar'); if (b && !modoApp()) b.hidden = false;
});
(function registrarApp() {
  // Só na versão publicada como site (https), não no arquivo baixado com dados embutidos.
  var embutido = document.getElementById('dados-embutidos');
  if (embutido && embutido.textContent.trim()) return;
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  // "?atualizar" no endereço: apaga a cópia guardada do aplicativo e recarrega a versão publicada
  // (os dados das OMs ficam no IndexedDB e não são apagados)
  if (/[?&]atualizar\b/.test(location.search)) {
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
      window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null
    ]).catch(function () { /* segue */ }).then(function () { location.replace(location.pathname); });
    return;
  }
  try { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { /* sem modo offline */ }); } catch (e) { /* idem */ }
})();

function iniciarPainel() {
  try { aplicarTemaSalvo(); } catch (e) { /* tema padrão */ }
  // Usa a base mais recente entre a embutida no arquivo e a última carregada neste aparelho
  // (pelo botão "Atualizar base"); assim uma planilha nova não é perdida ao reabrir o painel.
  var embutido = document.getElementById('dados-embutidos').textContent.trim();
  var modeloEmbutido = embutido ? JSON.parse(embutido) : null;
  lerBaseGuardada().then(function (salvo) {
    var m = maisRecente(salvo, modeloEmbutido);
    try { if (m) iniciar(m); else telaCarga(); } catch (e) { telaErro(e); }
  });
}
</script>
