<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Turbinas</title>
<meta name="description" content="Ordens de manutenção dos aerogeradores do Complexo Asa Branca: backlog, mão de obra, custos e mapa de turbinas, com filtros e segmentação.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M16 17 L16 29 M16 17 L9 6 M16 17 L27 13 M16 17 L8 22' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='17' r='2.6' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f3f3f0;
  --surface: #fcfcfb;
  --surface-2: #f6f6f3;
  --hover: rgba(11, 11, 11, .045);
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7a7974;
  --grid: #e7e6e0;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, .10);
  --empty: #ecebe6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --neutral: #b9b8b1;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --critical-ink: #b42a2a;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, .10);
  --shadow: 0 1px 2px rgba(11, 11, 11, .04), 0 1px 1px rgba(11, 11, 11, .02);
  --shadow-pop: 0 12px 32px rgba(11, 11, 11, .14), 0 2px 6px rgba(11, 11, 11, .06);
  --rail: #14233a;
  --rail-ink: #c9d6e8;
  --rail-active: #ffffff;
  --titulo-marca: #014e77;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --hover: rgba(255, 255, 255, .06);
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8e88; --grid: #2c2c2a; --axis: #45453f;
    --border: rgba(255, 255, 255, .10); --empty: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --neutral: #5d5c57; --good-ink: #0ca30c; --critical-ink: #e66767;
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, .16);
    --shadow: none; --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5);
    --rail: #111a26; --rail-ink: #9fb0c6;
    --titulo-marca: #5cc4e0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --hover: rgba(255, 255, 255, .06);
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8e88; --grid: #2c2c2a; --axis: #45453f;
  --border: rgba(255, 255, 255, .10); --empty: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --neutral: #5d5c57; --good-ink: #0ca30c; --critical-ink: #e66767;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, .16);
  --shadow: none; --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5);
  --rail: #111a26; --rail-ink: #9fb0c6;
  --titulo-marca: #5cc4e0;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--rail) 76px, transparent 76px); }
.rail {
  background: var(--rail); color: var(--rail-ink);
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; align-items: stretch; padding: 12px 8px; gap: 4px;
}
.rail .marca { display: grid; place-items: center; height: 44px; margin-bottom: 10px; }
.rail .marca svg, .rail .marca img { width: 34px; height: 34px; display: block; }
.topo .marca-topo { width: 42px; height: 42px; flex-shrink: 0; display: block; }
.topo .titulo { flex: 1 1 0; min-width: 0; }
.topo.com-marca h1 { color: var(--titulo-marca); }
.nav-btn {
  border: 0; background: transparent; color: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 2px; border-radius: 8px; font-size: 11px; font-weight: 550; letter-spacing: .01em;
  position: relative;
}
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-btn[aria-current="page"] { background: rgba(255, 255, 255, .12); color: var(--rail-active); }
.nav-btn[aria-current="page"]::before {
  content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: #6da7ec;
}
.rail .rodape { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topo {
  display: flex; align-items: center; gap: 16px; padding: 14px 24px 10px;
}
.topo h1 { font-size: 19px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.topo .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 550; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.prim { background: var(--accent); border-color: transparent; color: #fff; }
.btn.prim:hover { filter: brightness(1.06); }
.btn.icone { padding: 7px; }

/* ---------- barra de filtros (slicers) ---------- */
.filtros {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(8px);
  padding: 8px 24px 10px; border-bottom: 1px solid var(--border);
}
.filtros .linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.slicer {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  min-width: 128px; max-width: 220px; padding: 5px 30px 6px 11px; position: relative;
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; text-align: left;
  box-shadow: var(--shadow);
}
.slicer:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.slicer .rot { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.slicer .val { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slicer::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; margin-top: -5px;
  border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg);
}
.slicer.ativo { border-color: var(--accent); background: var(--accent-wash); }
.slicer.ativo .val { color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 3px; gap: 2px; box-shadow: var(--shadow); align-items: stretch; }
.seg .rot { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); align-self: center; padding: 0 6px 0 7px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 550; color: var(--ink-2); }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.limpar { border: 0; background: transparent; color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 0 6px; align-self: center; }
.limpar:hover { text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 4px 3px 10px;
  background: var(--accent-wash); color: var(--accent-ink); font-size: 12px; font-weight: 550; border: 0;
}
.chip b { font-weight: 650; }
.chip span.x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; }
.chip:hover span.x { background: color-mix(in srgb, var(--accent) 20%, transparent); }

/* popover */
.pop {
  position: fixed; z-index: 60; width: 300px; max-height: min(460px, 70vh);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; overflow: hidden;
}
.pop .busca { padding: 10px 10px 6px; }
.pop input[type="search"], .campo {
  width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 7px 10px; font-size: 13px;
}
.pop .acoes-pop { display: flex; justify-content: space-between; padding: 2px 12px 6px; font-size: 12px; }
.pop .acoes-pop button { border: 0; background: none; color: var(--accent-ink); font-weight: 600; padding: 2px 0; }
.pop .lista { overflow: auto; padding: 0 6px 8px; }
.opc {
  display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%;
  border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 13px;
}
.opc:hover { background: var(--hover); }
.opc .cx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--axis); display: grid; place-items: center; }
.opc[aria-checked="true"] .cx { background: var(--accent); border-color: var(--accent); }
.opc[aria-checked="true"] .cx::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.opc .qt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.opc.zero { color: var(--muted); }
.opc.grupo-tit { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 8px 4px; cursor: default; }
.opc.grupo-tit:hover { background: none; }
.periodo-opc { grid-template-columns: 18px 1fr auto; }
.periodo-opc .ck { width: 16px; height: 16px; display: grid; place-items: center; }
.periodo-opc[aria-checked="true"] .ck::after { content: ""; width: 5px; height: 10px; border: solid var(--accent); border-width: 0 2.5px 2.5px 0; transform: translateY(-2px) rotate(45deg); }
.periodo-opc[aria-checked="true"] { font-weight: 650; }
.pop .rodape-pop { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
.pop .rodape-pop label { display: flex; flex-direction: column; gap: 4px; }

/* ---------- página ---------- */
.pagina { padding: 18px 24px 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-content: start; }
.pagina.carregando { opacity: .55; transition: opacity .15s; }
.titulo-pag { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: -4px; }
.titulo-pag h2 { margin: 0; font-size: 16px; font-weight: 650; }
.titulo-pag p { margin: 0; color: var(--ink-2); font-size: 13px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 16px 18px 18px; min-width: 0; display: flex; flex-direction: column;
}
.card-h { display: flex; align-items: flex-start; gap: 8px 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h .tt { flex: 1 1 220px; }
.card-h .tt { min-width: 0; }
.card-h h3 { margin: 0; font-size: 14px; font-weight: 650; }
.card-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
.card-h .ferr { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.mini-btn {
  border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 6px;
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 550;
}
.mini-btn:hover { background: var(--hover); color: var(--ink); }
.mini-btn[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-wash); }
.mini-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
select.mini {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 4px 8px; font-size: 12.5px; font-weight: 550;
}
.card-b { min-width: 0; flex: 1; position: relative; }
.vazio { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }
.nota { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* KPI */
.kpi { padding: 14px 16px 14px; gap: 0; position: relative; }
.kpi .k-rot { font-size: 12.5px; color: var(--ink-2); font-weight: 550; display: flex; align-items: center; gap: 6px; }
.kpi .k-val { font-size: 27px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; }
.kpi .k-val small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .k-spark { position: absolute; right: 14px; top: 44px; opacity: .95; }
.st { display: inline-flex; align-items: flex-start; gap: 4px; font-weight: 600; font-size: 12px; }
.st svg { margin-top: 1px; }
.st svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.st.bom { color: var(--good-ink); } .st.ruim { color: var(--critical-ink); } .st.alerta { color: #a96b00; }
:root[data-theme="dark"] .st.alerta { color: var(--warning); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st.alerta { color: var(--warning); } }

/* barras horizontais */
.bh { display: flex; flex-direction: column; gap: 2px; }
.bh-row {
  display: grid; grid-template-columns: minmax(84px, var(--rot, 38%)) minmax(0, 1fr) auto; align-items: center; gap: 10px;
  border: 0; background: transparent; text-align: left; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; width: calc(100% + 12px);
}
button.bh-row:hover, .bh-row.foco { background: var(--hover); }
.bh-lab { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.bh-track { height: 14px; display: flex; gap: 2px; }
.bh-bar { height: 100%; border-radius: 0 4px 4px 0; min-width: 0; transition: width .25s ease; }
.bh-track .bh-bar + .bh-bar { border-radius: 0; }
.bh-track .bh-bar:last-child { border-radius: 0 4px 4px 0; }
.bh-track .bh-bar:only-child { border-radius: 0 4px 4px 0; }
.bh-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 44px; white-space: nowrap; }
.bh-val small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.bh-row.dim .bh-bar { opacity: .28; }
.bh-row.dim .bh-lab, .bh-row.dim .bh-val { color: var(--muted); }
.bh-row.sel .bh-lab { font-weight: 650; }

.legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: -2px 0 10px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legenda i.linha { height: 2px; width: 14px; border-radius: 1px; }

/* svg */
svg text { font-family: inherit; }
.eixo { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.grade { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.rot-dir { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
.grafico svg { display: block; overflow: visible; }
.grafico:focus-visible { outline-offset: 4px; }

/* mapa de calor */
.hm { display: grid; gap: 3px; align-items: center; }
.hm .hm-col { font-size: 10.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.hm-lin { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding-right: 8px; border: 0; background: none; text-align: left; border-radius: 6px; }
.hm-lin:hover { color: var(--accent-ink); }
.hm-lin.sel { color: var(--accent-ink); }
.cel {
  aspect-ratio: 1 / 1; border: 0; border-radius: 4px; padding: 0; display: grid; place-items: center;
  font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; position: relative; transition: transform .08s;
}
.cel:hover { transform: scale(1.12); z-index: 2; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.cel.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); z-index: 1; }
.cel.dim { opacity: .3; }
.hm-bloco { margin-bottom: 12px; }
.hm-bloco .hm-lin { padding: 0 0 6px; font-size: 13px; }
.hm-bloco .hm { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.hm-leg { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.hm-leg .grad { width: 160px; height: 10px; border-radius: 3px; }
.hm-leg .vz { width: 12px; height: 12px; border-radius: 3px; background: var(--empty); display: inline-block; vertical-align: -2px; margin-right: 4px; }

/* tabela */
.tab-wrap { overflow: auto; margin: 0 -18px -18px; border-top: 1px solid var(--border); }
.tab { width: 100%; border-collapse: collapse; font-size: 13px; }
.tab th {
  position: sticky; top: 0; background: var(--surface); z-index: 1;
  text-align: left; font-size: 11.5px; font-weight: 650; color: var(--ink-2); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
.tab th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tab th button:hover { color: var(--ink); }
.tab th.n, .tab td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tab th.n button { flex-direction: row-reverse; }
.tab td { padding: 8px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.tab tr:last-child td { border-bottom: 0; }
.tab tbody tr.clic { cursor: pointer; }
.tab tbody tr.clic:hover td, .tab tbody tr.clic:focus-visible td { background: var(--hover); }
.tab td.txt { white-space: normal; min-width: 320px; max-width: 460px; color: var(--ink-2); }
.tab td.txt .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tab td.forte { font-weight: 600; }
.tab td.quebra { white-space: normal; min-width: 150px; }
.db { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.db .tr { width: 56px; height: 8px; display: flex; justify-content: flex-start; }
.db .tr i { height: 100%; border-radius: 0 3px 3px 0; background: var(--s1); opacity: .85; }
.seta { width: 8px; height: 8px; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 550; padding: 1px 8px 1px 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
.pill i { width: 7px; height: 7px; border-radius: 50%; }
.pag { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 10px 18px 0; font-size: 12.5px; color: var(--ink-2); }
.barra-tab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.barra-tab .campo { max-width: 340px; }

/* destaques */
.destaques { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.destaques li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 13.5px; line-height: 1.5; }
.destaques .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent-ink); }
.destaques .ic svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.destaques b { font-weight: 650; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* tooltip */
.tip {
  position: fixed; z-index: 80; pointer-events: none; min-width: 140px; max-width: 280px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-pop);
  padding: 8px 10px; font-size: 12.5px; opacity: 0; transition: opacity .08s;
}
.tip.on { opacity: 1; }
.tip .t-tit { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
.tip .t-lin { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; }
.tip .t-lin i { height: 2.5px; border-radius: 2px; }
.tip .t-lin b { font-weight: 700; font-variant-numeric: tabular-nums; }
.tip .t-lin span { color: var(--ink-2); }
.tip .t-nota { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

/* drawer / modal */
.veu { position: fixed; inset: 0; background: rgba(8, 10, 14, .38); z-index: 70; opacity: 0; transition: opacity .18s; }
.veu.on { opacity: 1; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 75; background: var(--page);
  box-shadow: var(--shadow-pop); transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column;
}
.drawer.on { transform: none; }
.drawer-h { padding: 18px 20px 14px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.drawer-h h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.drawer-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.drawer-h .ferr { margin-left: auto; display: flex; gap: 6px; }
.drawer-b { overflow: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini-kpis .card { padding: 10px 12px; }
.mini-kpis .k-rot { font-size: 11.5px; color: var(--ink-2); }
.mini-kpis .k-val { font-size: 20px; font-weight: 650; margin-top: 2px; }
.modal {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -48%); opacity: 0; z-index: 75;
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow: auto; overscroll-behavior: contain;

.modal.on { opacity: 1; transform: translate(-50%, -50%); }
.modal .drawer-h { position: sticky; top: 0; border-radius: 14px 14px 0 0; }
.campos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; padding: 16px 20px; }
.campos div span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.campos div b { font-weight: 600; font-size: 13.5px; }
.bloco-txt { padding: 0 20px 18px; }
.bloco-txt h4 { margin: 4px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.bloco-txt p { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }

/* tela de carga */
.boas-vindas { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.drop {
  width: min(620px, 100%); background: var(--surface); border: 1.5px dashed var(--axis); border-radius: 16px; padding: 40px 32px; text-align: center;
}
.drop.sobre { border-color: var(--accent); background: var(--accent-wash); }
.drop h1 { font-size: 22px; margin: 14px 0 6px; }
.drop p { color: var(--ink-2); margin: 0 0 20px; }
.drop .erro { color: var(--critical-ink); font-weight: 600; margin-top: 14px; }
.drop .logo { width: 56px; height: 56px; display: inline-block; }

/* ---------- responsivo ---------- */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .s3, .s4, .s5 { grid-column: span 6; }
  .s7, .s8 { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); background: none; }
  .rail {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 50; flex-direction: row;
    padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); overflow-x: auto; gap: 2px;
  }
  .rail .marca, .rail .rodape { display: none; }
  .nav-btn { flex: 1 0 64px; padding: 6px 2px; font-size: 10.5px; }
  .nav-btn[aria-current="page"]::before { left: 14px; right: 14px; top: -4px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  .main { padding-bottom: 68px; }
  .topo { padding: 12px 16px 8px; flex-wrap: wrap; }
  .topo .acoes .txt { display: none; }
  .topo { gap: 12px; align-items: flex-start; }
  .topo h1 { font-size: 17px; }
  .topo .marca-topo { width: 38px; height: 38px; margin-top: 2px; }
  .topo .acoes { margin-left: 0; width: 100%; justify-content: flex-end; }
  .filtros { padding: 8px 16px; }
  .filtros .linha { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .slicer { min-width: 116px; flex-shrink: 0; }
  .seg { flex-shrink: 0; }
  .pagina { padding: 14px 16px 32px; gap: 12px; }
  .s3, .s4, .s5, .s6, .s7, .s8 { grid-column: 1 / -1; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kpi .k-val { font-size: 23px; }
  .kpi .k-spark { display: none; }
  .campos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pop { width: calc(100vw - 32px); left: 16px !important; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
@media print {

  .app { grid-template-columns: 1fr; }
  .filtros { position: static; }
  .card { break-inside: avoid; }
}

function paginaTurbinas(pg) {
  var B = base();
  var porW = new Map();
  M.ativos.forEach(function (a) { porW.set(a.wtg, { k: a.wtg, wtg: M.dic.wtg[a.wtg], parque: M.parques[a.parque], pos: a.pos, oms: 0, corr: 0, prev: 0, bkl: 0, idadeS: 0, idadeN: 0, parada: 0, hh: 0, custo: 0, leadS: 0, leadN: 0 }); });
  B.forEach(function (i) {
    var r = porW.get(O.wtg[i]); if (!r) return;
    r.oms++;
    if (O.tipo[i] === IDX.tipo['Corretiva']) r.corr++;
    if (O.tipo[i] === IDX.tipo['Preventiva']) r.prev++;
    if (O.grupo[i] === IDX.grupo.Backlog) { r.bkl++; if (O.idadeBkl[i] !== null) { r.idadeS += O.idadeBkl[i]; r.idadeN++; } }
    r.parada += O.parada[i];
    r.hh += O.hhApont[i] || 0;
    if (custoValido(i)) r.custo += O.custoTot[i] || 0;
    if (O.leadH[i] !== null) { r.leadS += O.leadH[i]; r.leadN++; }
  });
  var linhas = Array.from(porW.values()).filter(function (r) {

function popDim(dim, el) {
  var itens = itensDim(dim);
  var cont = new Map();
  base(dim).forEach(function (i) { var k = valorDim(dim, i); cont.set(k, (cont.get(k) || 0) + 1); });
  var busca = null, lista = h('div', { class: 'lista', role: 'listbox', 'aria-multiselectable': 'true' });
  if (itens.length > 8) {
    busca = h('input', { type: 'search', placeholder: 'Buscar ' + ROTULO_DIM[dim].toLowerCase() + '…', 'aria-label': 'Buscar' });
    el.append(h('div', { class: 'busca' }, busca));
  }
  el.append(h('div', { class: 'acoes-pop' },
    h('button', { type: 'button', onclick: function () { estado.f[dim].clear(); atualizar(); preencher(); } }, 'Limpar seleção'),
    h('span', { style: 'color:var(--muted)' }, 'OMs no contexto')));
  el.append(lista);
  var ordem = itens.map(function (_, k) { return k; });
  if (dim === 'sistema') ordem.sort(function (a, b) { return (cont.get(b) || 0) - (cont.get(a) || 0) || itens[a].localeCompare(itens[b]); });
  function preencher() {
    var q = busca ? busca.value.trim().toLowerCase() : '';
    lista.textContent = '';
    var parqueAtual = -1;
    ordem.forEach(function (k) {
      if (q && itens[k].toLowerCase().indexOf(q) < 0) return;
      if (dim === 'wtg' && !q) {
        var p = parqueDoWtg[k];
        if (p !== parqueAtual) {
          parqueAtual = p;
          lista.append(h('div', { class: 'opc grupo-tit' }, M.parques[p]));
        }
      }
      var marcado = estado.f[dim].has(k), qt = cont.get(k) || 0;
      lista.append(h('button', { type: 'button', class: 'opc' + (qt ? '' : ' zero'), role: 'option', 'aria-checked': String(marcado), 'aria-selected': String(marcado),
        onclick: function () { if (estado.f[dim].has(k)) estado.f[dim].delete(k); else estado.f[dim].add(k); atualizar(); preencher(); } },
        h('span', { class: 'cx' }), h('span', null, itens[k]), h('span', { class: 'qt' }, fInt(qt))));
    });
    if (!lista.childNodes.length) lista.append(h('div', { class: 'vazio' }, 'Nada encontrado.'));
  }
  if (busca) busca.addEventListener('input', preencher);
  preencher();
  (busca || lista.querySelector('button') || el).focus();
}

function presetsPeriodo() {
  var r = [{ chave: 'tudo', rot: 'Todo o período', ini: diaMin, fim: diaMax }];
  r.push({ chave: 'u30', rot: 'Últimos 30 dias', ini: Math.max(diaMin, diaMax - 29), fim: diaMax });
  r.push({ chave: 'u90', rot: 'Últimos 90 dias', ini: Math.max(diaMin, diaMax - 89), fim: diaMax });
  var dIni = dataDe(diaMin), dFim = dataDe(diaMax);
  var tri = [];
  for (var ano = dIni.getUTCFullYear(); ano <= dFim.getUTCFullYear(); ano++) for (var t = 0; t < 4; t++) {
    var a = diaDe(new Date(Date.UTC(ano, t * 3, 1))), b = diaDe(new Date(Date.UTC(ano, t * 3 + 3, 1))) - 1;
    if (b < diaMin || a > diaMax) continue;
    tri.push({ chave: 't' + ano + '-' + (t + 1), rot: (t + 1) + 'º trimestre ' + ano, ini: Math.max(a, diaMin), fim: Math.min(b, diaMax), grupo: 'Trimestres' });
  }
  var meses = [];
  var ano2 = dIni.getUTCFullYear(), mes = dIni.getUTCMonth();
  while (ano2 < dFim.getUTCFullYear() || (ano2 === dFim.getUTCFullYear() && mes <= dFim.getUTCMonth())) {
    var a2 = diaDe(new Date(Date.UTC(ano2, mes, 1))), b2 = diaDe(new Date(Date.UTC(ano2, mes + 1, 1))) - 1;
    meses.push({ chave: 'm' + ano2 + '-' + (mes + 1), rot: MESES_LONGO[mes].charAt(0).toUpperCase() + MESES_LONGO[mes].slice(1) + ' ' + ano2, ini: Math.max(a2, diaMin), fim: Math.min(b2, diaMax), grupo: 'Meses' });
    mes++; if (mes > 11) { mes = 0; ano2++; }
  }
  return r.concat(tri, meses.reverse());
}
function textoPeriodo() {
  var p = presetsPeriodo().filter(function (x) { return x.chave === estado.per.chave; })[0];
  return p ? p.rot : fData(estado.per.ini) + ' – ' + fData(estado.per.fim);
}
function popPeriodo(el) {
  var lista = h('div', { class: 'lista', role: 'listbox', style: 'padding-top:6px' });
  var grupo = null;
  presetsPeriodo().forEach(function (p) {
    if (p.grupo && p.grupo !== grupo) { grupo = p.grupo; lista.append(h('div', { class: 'opc grupo-tit' }, grupo)); }
    var sel = estado.per.chave === p.chave;
    lista.append(h('button', { type: 'button', class: 'opc periodo-opc', role: 'option', 'aria-checked': String(sel), 'aria-selected': String(sel),
      onclick: function () { estado.per = { chave: p.chave, ini: p.ini, fim: p.fim }; fecharPop(); atualizar(); } },
      h('span', { class: 'ck' }), h('span', null, p.rot), h('span', { class: 'qt' }, p.chave === 'tudo' ? '' : fDataCurta(p.ini) + '–' + fDataCurta(p.fim))));
  });
  var de = h('input', { type: 'date', class: 'campo', value: isoDe(estado.per.ini), min: isoDe(diaMin), max: isoDe(diaMax) });
  var ate = h('input', { type: 'date', class: 'campo', value: isoDe(estado.per.fim), min: isoDe(diaMin), max: isoDe(diaMax) });
  var aplicar = function () {
    if (!de.value || !ate.value) return;
    var a = diaDeIso(de.value), b = diaDeIso(ate.value);
    if (a > b) { var t = a; a = b; b = t; }
    estado.per = { chave: 'custom', ini: Math.max(diaMin, a), fim: Math.min(diaMax, b) };
    atualizar();
  };
  de.addEventListener('change', aplicar); ate.addEventListener('change', aplicar);
  el.append(lista, h('div', { class: 'rodape-pop' }, h('label', null, 'De', de), h('label', null, 'Até', ate)));
  var s = lista.querySelector('[aria-checked="true"]'); (s || lista.querySelector('button')).focus();
}

function renderFiltros(cont) {
  cont.textContent = '';
  var linha = h('div', { class: 'linha', role: 'toolbar', 'aria-label': 'Filtros do painel' });
  var bPer = h('button', { type: 'button', class: 'slicer' + (estado.per.chave !== 'tudo' ? ' ativo' : ''), 'aria-haspopup': 'dialog', 'aria-expanded': 'false' },
    h('span', { class: 'rot' }, 'Período'), h('span', { class: 'val' }, textoPeriodo()));
  bPer.addEventListener('click', function () { abrirPop(bPer, popPeriodo, 'periodo'); });
  linha.append(bPer);
  ['parque', 'wtg', 'tipo', 'sistema', 'status'].forEach(function (dim) {
    var b = h('button', { type: 'button', class: 'slicer' + (estado.f[dim].size ? ' ativo' : ''), 'aria-haspopup': 'dialog', 'aria-expanded': 'false' },
      h('span', { class: 'rot' }, ROTULO_DIM[dim]), h('span', { class: 'val' }, textoDim(dim)));
    b.addEventListener('click', function () { abrirPop(b, function (el) { popDim(dim, el); }, dim); });
    linha.append(b);
  });
  var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Máquina parada' }, h('span', { class: 'rot' }, 'Máq. parada'));
  [['Todas', null], ['Sim', 1], ['Não', 0]].forEach(function (o) {
    var ativo = o[1] === null ? !estado.f.parada.size : estado.f.parada.size === 1 && estado.f.parada.has(o[1]);
    seg.append(h('button', { type: 'button', 'aria-pressed': String(ativo), onclick: function () { estado.f.parada.clear(); if (o[1] !== null) estado.f.parada.add(o[1]); atualizar(); } }, o[0]));
  });
  linha.append(seg);
  if (temFiltro()) linha.append(h('button', { type: 'button', class: 'limpar', onclick: limparTudo }, 'Limpar filtros'));
  cont.append(linha);

  var chips = h('div', { class: 'chips', 'aria-label': 'Filtros ativos' });
  DIMS.forEach(function (dim) {
    var itens = itensDim(dim);
    estado.f[dim].forEach(function (k) {
      chips.append(h('button', { type: 'button', class: 'chip', 'aria-label': 'Remover filtro ' + ROTULO_DIM[dim] + ': ' + itens[k], onclick: function () { estado.f[dim].delete(k); atualizar(); } },
        h('span', null, ROTULO_DIM[dim] + ': ', h('b', null, itens[k])), h('span', { class: 'x', 'aria-hidden': 'true' }, '×')));
    });
  });
  cont.append(chips);
}
function temFiltro() { return estado.per.chave !== 'tudo' || DIMS.some(function (d) { return estado.f[d].size; }); }
function limparTudo() {
  DIMS.forEach(function (d) { estado.f[d].clear(); });
  estado.per = { chave: 'tudo', ini: diaMin, fim: diaMax };
  atualizar();
}

/* =====================================================================
   Estado na URL (link compartilhável)
   ===================================================================== */
function salvarHash() {
  var p = new URLSearchParams();
  p.set('p', estado.pagina);
  if (estado.per.chave !== 'tudo') p.set('per', estado.per.chave === 'custom' ? estado.per.ini + '_' + estado.per.fim : estado.per.chave);
  DIMS.forEach(function (d) { if (estado.f[d].size) p.set(d, Array.from(estado.f[d]).join('.')); });
  if (estado.metricaMapa !== 'oms') p.set('mapa', estado.metricaMapa);
  if (estado.atipicos) p.set('atip', '1');
  var novo = '#' + p.toString();
  if (location.hash !== novo) history.replaceState(null, '', novo);
}
function lerHash() {
  var p = new URLSearchParams(location.hash.slice(1));
  if (PAGINAS[p.get('p')]) estado.pagina = p.get('p');
  var per = p.get('per');
  estado.per = { chave: 'tudo', ini: diaMin, fim: diaMax };
  if (per) {
    var m = /^(\d+)_(\d+)$/.exec(per);
    if (m) estado.per = { chave: 'custom', ini: Math.max(diaMin, +m[1]), fim: Math.min(diaMax, +m[2]) };
    else { var pr = presetsPeriodo().filter(function (x) { return x.chave === per; })[0]; if (pr) estado.per = { chave: pr.chave, ini: pr.ini, fim: pr.fim }; }
  }
  DIMS.forEach(function (d) {
    estado.f[d] = new Set();
    var v = p.get(d); if (!v) return;
    var max = itensDim(d).length;
    v.split('.').forEach(function (x) { var n = parseInt(x, 10); if (n >= 0 && n < max) estado.f[d].add(n); });
  });
  if (METRICAS_MAPA[p.get('mapa')]) estado.metricaMapa = p.get('mapa');
  estado.atipicos = p.get('atip') === '1';
}

/* =====================================================================
   Montagem da aplicação
   ===================================================================== */
var PAGINAS = {
  visao: { rot: 'Visão geral', icone: 'visao', fn: paginaVisao },
  turbinas: { rot: 'Turbinas', icone: 'turbinas', fn: paginaTurbinas },
  backlog: { rot: 'Backlog', icone: 'backlog', fn: paginaBacklog },
  hh: { rot: 'Mão de obra', icone: 'hh', fn: paginaHH },
  custos: { rot: 'Custos', icone: 'custos', fn: paginaCustos },
  ordens: { rot: 'Ordens', icone: 'ordens', fn: paginaOrdens }
};
var refs = {};

function montarApp() {
  var raiz = document.getElementById('raiz');
  raiz.textContent = '';
  var nav = h('nav', { class: 'rail', 'aria-label': 'Páginas do painel' },
    LOGO_URL ? null : h('div', { class: 'marca', 'aria-hidden': 'true' }, logo()));
  Object.keys(PAGINAS).forEach(function (k) {
    nav.append(h('button', { type: 'button', class: 'nav-btn', 'data-p': k, onclick: function () { irPara(k); } }, icone(PAGINAS[k].icone), PAGINAS[k].rot));
  });
  nav.append(h('div', { class: 'rodape' },
    h('button', { type: 'button', class: 'nav-btn', onclick: alternarTema, 'aria-label': 'Alternar tema claro/escuro' }, icone(temaEscuro() ? 'sol' : 'lua'), 'Tema')));

  var nTurb = M.ativos.length, modelo = M.ativos[0] && M.ativos[0].modelo;
  var topo = h('header', { class: 'topo' + (LOGO_URL ? ' com-marca' : '') },
    LOGO_URL ? (function () { var l = logo(); l.setAttribute('class', 'marca-topo'); return l; })() : null,
    h('div', { class: 'titulo' },
      h('h1', null, 'Manutenção de Aerogeradores · Complexo Asa Branca'),
      h('div', { class: 'sub' }, fInt(nTurb) + ' turbinas' + (modelo ? ' ' + modelo : '') + ' · ' + M.parques.length + ' parques · ' + fInt(N) + ' OMs · dados de ' + fData(diaMin) + ' a ' + fData(diaMax))),
    h('div', { class: 'acoes' },
      h('button', { class: 'btn', type: 'button', onclick: function () { window.print(); }, title: 'Imprimir ou salvar em PDF' }, icone('imprimir'), h('span', { class: 'txt' }, 'PDF')),
      h('button', { class: 'btn', type: 'button', onclick: escolherArquivo, title: 'Carregar outra planilha' }, icone('enviar'), h('span', { class: 'txt' }, 'Trocar base')),
      h('button', { class: 'btn icone', type: 'button', onclick: alternarTema, 'aria-label': 'Alternar tema claro/escuro', title: 'Tema claro/escuro' }, icone(temaEscuro() ? 'sol' : 'lua'))));
  var filtros = h('div', { class: 'filtros' });
  var pagina = h('main', { class: 'pagina', id: 'pagina', tabindex: '-1' });
  raiz.append(h('div', { class: 'app' }, nav, h('div', { class: 'main' }, topo, filtros, pagina)));
  refs = { nav: nav, filtros: filtros, pagina: pagina };
  atualizar(true);
}

function irPara(k) {
  estado.pagina = k;
  fecharPop();
  atualizar();
  refs.pagina.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function atualizar() {
  renderFiltros(refs.filtros);
  Array.prototype.forEach.call(refs.nav.querySelectorAll('[data-p]'), function (b) {
    if (b.getAttribute('data-p') === estado.pagina) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (popAberto) { var b = refs.filtros.querySelectorAll('.slicer'); popAberto.botao = popAberto.botao; }
  renderPagina();
  salvarHash();
  document.title = PAGINAS[estado.pagina].rot + ' · Painel de Turbinas';
}

function renderPagina() {
  var pg = refs.pagina;
  var rolagem = window.scrollY;
  pg.textContent = '';
  aposRender = [];
  esconderTip();
  PAGINAS[estado.pagina].fn(pg);
  aposRender.forEach(function (f) { f(); });
  aposRender = [];
  window.scrollTo(0, rolagem);
}

var redimTimer;
window.addEventListener('resize', function () {
  clearTimeout(redimTimer);
  redimTimer = setTimeout(function () { if (M && refs.pagina) renderPagina(); }, 150);
});

/* ---------- tema ---------- */
function aplicarTemaSalvo() {
  try { var t = localStorage.getItem(CHAVE_TEMA); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* sem armazenamento */ }
}
function alternarTema() {
  var novo = temaEscuro() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', novo);
  try { localStorage.setItem(CHAVE_TEMA, novo); } catch (e) { /* sem armazenamento */ }
  if (M) montarApp();
}

function logo() {
  if (LOGO_URL) return h('img', { src: LOGO_URL, alt: LOGO_NOME, width: '42', height: '42', decoding: 'async' });
  var s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', '0 0 32 32');
  s.innerHTML = '<rect width="32" height="32" rx="9" fill="#2a78d6"/><path d="M16 17v12M16 17 9.5 6M16 17l11-4M16 17 7.5 22" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/><circle cx="16" cy="17" r="2.6" fill="#fff"/>';
  return s;
}

/* =====================================================================
   Carga dos dados
   ===================================================================== */
function iniciar(modelo) {
  M = modelo; O = M.ordens; A = M.apont; N = O.om.length;
  origemMs = Date.parse(M.origem + 'T00:00:00Z');
  parqueDoWtg = []; posDoWtg = [];
  M.ativos.forEach(function (a) { parqueDoWtg[a.wtg] = a.parque; posDoWtg[a.wtg] = a.pos; });
  // turbinas que aparecem nas OMs mas não no cadastro
  M.dic.wtg.forEach(function (_, k) { if (parqueDoWtg[k] === undefined) parqueDoWtg[k] = -1; });
  ['tipo', 'grupo', 'status', 'faixa', 'entrega'].forEach(function (d) { IDX[d] = {}; M.dic[d].forEach(function (n, k) { IDX[d][n] = k; }); });
  diaMin = Infinity; diaMax = M.ultimoDia;
  for (var i = 0; i < N; i++) if (O.dAb[i] !== null && O.dAb[i] < diaMin) diaMin = O.dAb[i];
  lerHash();
  montarApp();
}

function carregarSheetJS() {
  return new Promise(function (ok, erro) {
    if (window.XLSX) return ok(window.XLSX);
    var s = document.createElement('script');
    s.src = SHEETJS_URL;
    s.onload = function () { ok(window.XLSX); };
    s.onerror = function () { erro(new Error('Não foi possível carregar o leitor de Excel (SheetJS). Verifique a conexão com a internet.')); };
    document.head.append(s);
  });
}

function lerArquivo(arquivo, aoErro) {
  carregarSheetJS().then(function (XLSX) {
    return arquivo.arrayBuffer().then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array' });
      var modelo = ModeloTurbinas.montar(wb, XLSX);
      try { localStorage.setItem(CHAVE_BASE, JSON.stringify(modelo)); } catch (e) { /* base grande demais ou armazenamento bloqueado */ }
      location.hash = '';
      iniciar(modelo);
    });
  }).catch(function (e) { aoErro(e.message || String(e)); });
}

function escolherArquivo() {
  var inp = h('input', { type: 'file', accept: '.xlsx,.xlsm,.xls' });
  inp.addEventListener('change', function () { if (inp.files[0]) lerArquivo(inp.files[0], function (msg) { alert(msg); }); });
  inp.click();
}

function telaCarga(msgErro) {
  var raiz = document.getElementById('raiz');
  raiz.textContent = '';
  var erro = h('div', { class: 'erro', role: 'alert' }, msgErro || '');
  var drop = h('div', { class: 'drop' },
    (function () { var l = logo(); l.setAttribute('class', 'logo'); return l; })(),
    h('h1', null, 'Painel de Turbinas'),
    h('p', null, 'Arraste aqui a planilha “Base_PowerBI_Ordens” (.xlsx) ou escolha o arquivo. Os dados são lidos apenas no seu navegador — nada é enviado.'),
    h('button', { class: 'btn prim', type: 'button', onclick: escolherArquivo }, icone('enviar'), 'Escolher planilha'),
    erro);
  ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.add('sobre'); }); });
  ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.remove('sobre'); }); });
  drop.addEventListener('drop', function (ev) {
    var f = ev.dataTransfer.files[0];
    if (f) { erro.textContent = 'Lendo planilha…'; lerArquivo(f, function (m) { erro.textContent = m; }); }
  });
  raiz.append(h('div', { class: 'boas-vindas' }, drop));
}

(function () {
  aplicarTemaSalvo();
  var embutido = document.getElementById('dados-embutidos').textContent.trim();
  if (embutido) { iniciar(JSON.parse(embutido)); return; }
  var salvo = null;
  try { salvo = localStorage.getItem(CHAVE_BASE); } catch (e) { /* sem armazenamento */ }
  if (salvo) { try { iniciar(JSON.parse(salvo)); return; } catch (e) { /* base salva inválida */ } }
  telaCarga();
})();
