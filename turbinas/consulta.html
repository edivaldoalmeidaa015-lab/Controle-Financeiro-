<!--/ESQ--><title>Consulta de OMs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa de filtros fixa no topo, 4 cartões, 3 visuais em grade e a tabela de consulta embaixo (uma tela de painel, estilo Power BI). */
:root {
  /* paleta Essentia (do logo): azul-petróleo, turquesa, laranja e vermelho */
  --bg: #edf3f5;
  --surface: #ffffff;
  --surface-2: #f3f8f9;
  --line: #d4e1e6;
  --fg: #0c2a38;
  --fg-2: #4a6572;
  --fg-3: #7f959f;
  --label: #004a6b;
  --accent: #004a6b;
  --accent-2: #004a6b;
  --accent-soft: #d9eef2;
  --brand-grad: linear-gradient(90deg, #004a6b, #2a8fb2 35%, #4bbac8 55%, #f8a810 75%, #f07020);
  --s-fechada: #004a6b;
  --s-aberta: #f39318;
  --s-cancel: #a9b9c0;
  --warn-bg: #fff2d9;
  --warn-fg: #8a5200;
  --mark: #ffe08a;
  --good: #1f8a3a;
  --s-prog: #2a8fb2;
  --s-exec: #2a8fb2;
  --bad: #b81a2b;
  --logo-ground: #ffffff; /* fundo próprio do logo da empresa, igual nos dois temas */
  --shadow: 0 1px 2px rgba(0, 74, 107, .07), 0 2px 8px rgba(0, 74, 107, .05);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1a21; --surface: #11242d; --surface-2: #163039; --line: #244350;
    --fg: #e4eff3; --fg-2: #9cb5bf; --fg-3: #6b8792; --label: #6fc6d3;
    --accent: #4bbac8; --accent-2: #4bbac8; --accent-soft: #123a47;
    --s-fechada: #2f8fb5; --s-aberta: #f5a02a; --s-cancel: #4f6670; --s-prog: #9fd6e0; --s-exec: #6fc6d3;
    --warn-bg: #3a2a0a; --warn-fg: #f5c463; --mark: #6b5512; --good: #3fb760; --bad: #ef5f6a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1a21; --surface: #11242d; --surface-2: #163039; --line: #244350;
  --fg: #e4eff3; --fg-2: #9cb5bf; --fg-3: #6b8792; --label: #6fc6d3;
  --accent: #4bbac8; --accent-2: #4bbac8; --accent-soft: #123a47;
  --s-fechada: #2f8fb5; --s-aberta: #f5a02a; --s-cancel: #4f6670; --s-prog: #9fd6e0; --s-exec: #6fc6d3;
  --warn-bg: #3a2a0a; --warn-fg: #f5c463; --mark: #6b5512; --good: #3fb760; --bad: #ef5f6a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .92em; }

/* topo */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
header.top::after { content: ""; display: block; height: 3px; background: var(--brand-grad); }
.top-1 { display: flex; align-items: center; gap: 16px; padding-block: 10px 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg, .brand img { flex: none; }
.brand img { width: 36px; height: 36px; border-radius: 8px; }
.brand .logo-full { display: inline-flex; background: var(--logo-ground); border-radius: 6px; padding: 3px 8px; }
.brand .logo-full img { width: auto; height: 34px; border-radius: 0; }
.brand .brand-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; margin: 0; letter-spacing: .01em; color: var(--label); }
.brand small { display: block; color: var(--fg-2); font-size: .78rem; }
.search { flex: 1 1 340px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-width: 0; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; outline: none; font-size: .95rem; }
.search .hint { color: var(--fg-3); font-size: .75rem; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: .82rem; font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-block: 0 10px; }
.fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.flabel { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--label); font-weight: 700; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: .8rem; line-height: 1.4; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip .c { font-size: .72rem; opacity: .75; }
.chip.dd::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
.chip.sm { padding: 2px 8px; font-size: .76rem; }
.sep { width: 1px; height: 20px; background: var(--line); }
.active-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-block: 0 10px; }
.active-bar:empty { display: none; }
.tag { background: var(--accent-soft); color: var(--fg); border-radius: 4px; padding: 2px 4px 2px 8px; font-size: .78rem; display: inline-flex; gap: 4px; align-items: center; }
.tag button { border: 0; background: transparent; padding: 0 4px; font-size: 1rem; line-height: 1; color: var(--fg-2); }

/* popover multi-seleção */
.pop { position: fixed; z-index: 40; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; max-height: min(460px, 70vh); }
.pop input[type="search"] { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.pop .list { overflow: auto; padding: 0 4px 4px; }
.pop label { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 4px; font-size: .84rem; cursor: pointer; }
.pop label:hover { background: var(--surface-2); }
.pop label span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop label span.c { color: var(--fg-3); font-size: .75rem; }
.pop .foot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }

main { display: grid; gap: 14px; padding-block: 14px 40px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .k-lab { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--label); font-weight: 700; }
.kpi .k-val { font-family: var(--f-display); font-weight: 600; font-size: 2.1rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .k-sub { color: var(--fg-2); font-size: .82rem; display: flex; gap: 4px 12px; flex-wrap: wrap; }
.kpi .k-sub b { color: var(--fg); font-weight: 600; }
#seg-sit button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.k-sit { border: 0; background: transparent; padding: 1px 4px; margin: 0 -4px; border-radius: 4px; color: inherit; font: inherit; }
.k-sit:hover { background: var(--accent-soft); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }
.split { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); gap: 2px; margin-top: 4px; }
.split i { display: block; height: 100%; }
.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 3px 8px; font-size: .74rem; margin-top: 4px; }

.viz { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.panel { padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.ph h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; margin: 0; color: var(--label); }
.ph p { margin: 0; color: var(--fg-3); font-size: .76rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 9px; font-size: .75rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.legend { display: flex; gap: 12px; font-size: .76rem; color: var(--fg-2); flex-wrap: wrap; }
svg text { fill: var(--fg-2); font-family: var(--f-body); }
.chart { position: relative; min-height: 120px; }
.bar-hit { cursor: pointer; }
.bar-hit:hover rect.bg { fill: var(--surface-2); }
.mlist { display: flex; flex-direction: column; gap: 2px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 5px 6px; border-radius: 4px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-pressed="true"] { background: var(--accent-soft); }
.mrow .mn { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .mn .cd { color: var(--fg-3); font-family: var(--f-mono); font-size: .72rem; margin-left: 4px; }
.mrow .mv { font-size: .8rem; font-variant-numeric: tabular-nums; color: var(--fg); text-align: right; }
.mrow .mb { grid-column: 1 / -1; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.mrow .mb i { display: block; height: 100%; background: var(--accent-2); border-radius: 0 3px 3px 0; }
.mrow .ms { grid-column: 1 / -1; font-size: .72rem; color: var(--fg-3); }
.empty { color: var(--fg-3); font-size: .85rem; padding: 24px 0; text-align: center; }
.chk { display: inline-flex; gap: 5px; align-items: center; font-size: .76rem; color: var(--fg-2); }

/* tabela */
.tpanel { padding: 0; }
.tpanel .ph { padding: 12px 14px 8px; }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th { text-align: left; font-weight: 700; color: var(--label); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: .6rem; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: .6rem; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.desc { min-width: 240px; max-width: 420px; }
td.desc .d1 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
td.mat { min-width: 180px; max-width: 280px; color: var(--fg-2); font-size: .78rem; }
td.mat .m1 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: .72rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill.f { background: color-mix(in srgb, var(--s-fechada) 16%, transparent); color: var(--fg); border-color: color-mix(in srgb, var(--s-fechada) 45%, transparent); }
.pill.a { background: color-mix(in srgb, var(--s-aberta) 16%, transparent); color: var(--fg); border-color: color-mix(in srgb, var(--s-aberta) 45%, transparent); }
.pill.c { background: var(--surface-2); color: var(--fg-2); border-color: var(--line); }
.pcount { display: inline-flex; min-width: 22px; justify-content: center; border-radius: 4px; background: var(--surface-2); padding: 0 6px; font-size: .76rem; }
.pcount.has { background: var(--warn-bg); color: var(--warn-fg); font-weight: 600; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; color: var(--fg-2); font-size: .8rem; }
.pager .pg { display: flex; gap: 6px; align-items: center; }
.pager button:disabled { opacity: .4; cursor: default; }

/* mapa das turbinas */
.mapa { display: grid; gap: 3px; align-items: center; }
.mapa .mc { font-size: 10px; color: var(--fg-3); text-align: center; font-variant-numeric: tabular-nums; }
.mapa .ml { font-size: .76rem; font-weight: 600; color: var(--fg-2); white-space: nowrap; padding-right: 8px; border: 0; background: none; text-align: left; }
.mapa .ml:hover { color: var(--accent); }
.mapa .cx { grid-column: 1 / -1; font-family: var(--f-display); font-size: .95rem; font-weight: 600; color: var(--fg); padding: 8px 0 2px; }
.wtg { height: 26px; min-width: 0; border: 0; border-radius: 4px; padding: 0; display: grid; place-items: center; font-size: .66rem; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; }
.wtg:hover { z-index: 2; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--fg); }
.wtg.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); z-index: 1; }
.wtg.dim { opacity: .3; }
.mbloco { display: grid; gap: 3px; margin-bottom: 8px; }
.mbloco .ml { padding: 0 0 2px; }
.mleg { display: flex; align-items: center; gap: 10px; font-size: .74rem; color: var(--fg-2); flex-wrap: wrap; }
.mleg .grad { width: 150px; height: 10px; border-radius: 3px; }
.mleg .vz { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: inline-block; vertical-align: -2px; margin-right: 4px; }

/* materiais e pendências */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 14px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 12px 9px; font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; color: var(--fg-3); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.qf { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
.cell-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: .78rem; }
.cell-list li { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cell-list .q { font-variant-numeric: tabular-nums; color: var(--fg-2); }
.cell-list .more { color: var(--fg-3); }
td.cl { min-width: 190px; max-width: 280px; }
.nada { color: var(--fg-3); }
.ic { display: inline-block; width: 1.1em; text-align: center; font-weight: 700; margin-right: 2px; }
.ic.ok { color: var(--good); } .ic.no { color: var(--bad); } .ic.pe { color: var(--s-aberta); } .ic.ch { color: var(--fg-3); }
.selo { display: inline-flex; gap: 5px; align-items: center; border-radius: 4px; padding: 2px 7px; font-size: .72rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--line); }
.selo.ok { border-color: color-mix(in srgb, var(--good) 50%, transparent); background: color-mix(in srgb, var(--good) 12%, transparent); }
.selo.alerta { border-color: color-mix(in srgb, var(--s-aberta) 50%, transparent); background: color-mix(in srgb, var(--s-aberta) 12%, transparent); }
.selo.ruim { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }

/* carregar planilhas */
.boas { max-width: 640px; margin: 40px auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.boas h2 { font-family: var(--f-display); font-size: 1.6rem; margin: 0; }
.boas ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--fg-2); }
.boas ol b { color: var(--fg); }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 16px; text-align: center; color: var(--fg-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.on, body.arrastando .drop { border-color: var(--accent); background: var(--accent-soft); }
.nota { font-size: .8rem; color: var(--fg-3); }
.prog { position: fixed; z-index: 80; inset: 0; display: grid; place-items: center; background: rgba(10, 15, 20, .45); padding: 16px; }
.prog > div { background: var(--surface); border-radius: 10px; padding: 22px 26px; max-width: 420px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.prog .barra { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.prog .barra i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 3px; animation: vai 1.2s ease-in-out infinite; }
@keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
.opcoes { display: flex; flex-direction: column; gap: 10px; }
.opcoes button { text-align: left; padding: 12px 14px; }
.opcoes button b { display: block; font-size: .92rem; }
.opcoes button span { font-size: .8rem; color: var(--fg-2); font-weight: 400; }

/* ficha da OM */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, .45); z-index: 50; }
.drawer { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--surface); box-shadow: -8px 0 30px rgba(0,0,0,.2); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dh { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dh h3 { margin: 0; font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }
.dh .meta { color: var(--fg-2); font-size: .8rem; margin-top: 2px; }
.db { overflow: auto; padding: 14px 18px 30px; display: flex; flex-direction: column; gap: 18px; }
.db h4 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; font-size: .84rem; }
.kv div > span:first-child { display: block; color: var(--fg-3); font-size: .72rem; }
.dtext { font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin-bottom: 12px; }
.entry .eh { font-size: .75rem; color: var(--fg-2); margin-bottom: 3px; font-weight: 600; }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .88rem; max-width: 70ch; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.mini { width: 100%; border-collapse: collapse; font-size: .8rem; }
.mini td, .mini th { padding: 5px 6px; border-bottom: 1px solid var(--line); cursor: default; text-transform: none; letter-spacing: 0; font-size: .78rem; }
.mini th { background: transparent; }
.flag { color: var(--warn-fg); background: var(--warn-bg); font-size: .68rem; border-radius: 3px; padding: 0 4px; white-space: nowrap; }

    var xs = ent.filter(function (e) { return /\.xlsx$/i.test(e.nome) && !/(^|\/)(__MACOSX|\.)/.test(e.nome); });
    if (!xs.length) return Promise.reject(new Error('O arquivo .zip não tem nenhuma planilha .xlsx dentro.'));
    return Promise.all(xs.map(function (x) {
      var ini = x.local + 30 + dv.getUint16(x.local + 26, true) + dv.getUint16(x.local + 28, true), dados = u.subarray(ini, ini + x.tam);
      if (x.metodo === 0) return dados.slice().buffer;
      if (x.metodo !== 8 || typeof DecompressionStream === 'undefined') return Promise.reject(new Error('Não consegui abrir o .zip neste aparelho. Extraia a planilha .xlsx e escolha ela.'));
      return new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    }));
  }
  function lerBytes(f) {
    if (f.arrayBuffer) return f.arrayBuffer();
    return new Promise(function (ok, erro) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { erro(new Error('Não foi possível ler ' + f.name + '.')); }; r.readAsArrayBuffer(f); });
  }
  function progresso(msg) {
    var el = $('#prog');
    if (msg === null) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.className = 'prog'; el.id = 'prog'; el.setAttribute('role', 'status'); el.innerHTML = '<div><b id="prog-t"></b><div class="barra"><i></i></div><span class="nota">A leitura é feita só neste aparelho. Nada é enviado.</span></div>'; document.body.appendChild(el); }
    $('#prog-t').textContent = msg;
  }
  var depois = function (fn) { return new Promise(function (ok) { setTimeout(function () { ok(fn()); }, 60); }); };
  function carregarArquivos(files, modo) {
    files = [].slice.call(files || []);
    if (!files.length) return;
    if (!window.XLSX || !window.ConsultaDados || !window.ModeloTurbinas) { aviso('O leitor de planilhas não carregou. Verifique a internet e abra o painel de novo.'); return; }
    progresso('Abrindo ' + (files.length === 1 ? files[0].name : files.length + ' arquivos') + '…');
    Promise.all(files.map(function (f) {
      return lerBytes(f).then(planilhasDoZip).then(function (bufs) { return bufs.map(function (b, j) { return { nome: f.name + (bufs.length > 1 ? ' #' + (j + 1) : ''), buf: b }; }); });
    })).then(function (listas) {
      var novos = [].concat.apply([], listas);
      var lista = modo === 'somar' && BASE && BASE.arquivos ? BASE.arquivos.filter(function (a) {
        return !novos.some(function (b) { return b.nome === a.nome && b.buf.byteLength === a.buf.byteLength; });
      }).concat(novos) : novos;
      progresso('Lendo as planilhas…');
      return depois(function () {
        var livros = lista.map(function (a) {
          var wb = XLSX.read(new Uint8Array(a.buf), { type: 'array', cellDates: false });
          if (!ConsultaDados.abasReconhecidas(wb).length) throw new Error('"' + a.nome + '" não parece uma exportação do Manusis: faltam as abas "Ordens de manutenção", "Consumo de materiais" ou "Pendências".');
          return wb;
        });
        progresso('Cruzando OMs, materiais e pendências…');
        return depois(function () { return { r: ConsultaDados.montar(livros, XLSX, ModeloTurbinas), lista: lista }; });
      });
    }).then(function (x) {
      x.r.D.gerado = new Date().toISOString().slice(0, 10);
      BASE = { D: x.r.D, arquivos: x.lista };
      return guardar(BASE).then(function (ok) {
        progresso(null);
        reiniciar(x.r.D);
        var rs = x.r.resumo;
        aviso('Base atualizada: ' + fmtN.format(rs.oms) + ' OMs, ' + fmtN.format(rs.pendencias) + ' pendências, de ' + dataBR(rs.periodo[0]) + ' a ' + dataBR(rs.periodo[1]) + '.' + (ok ? '' : ' Este aparelho não deixou guardar a base: ela vale só enquanto o painel estiver aberto.'));
      });
    }).catch(function (e) {
      progresso(null);
      aviso((e && e.message) || 'Não consegui ler a planilha.');
    });
  }
  var modoArq = 'novo';
  $('#arq').onchange = function (e) { var fs = e.target.files; carregarArquivos(fs, modoArq); e.target.value = ''; };
  function escolher(modo) { modoArq = modo; fecharFicha(); $('#arq').click(); }
  $('#btn-base').onclick = function () {
    var podeSomar = BASE && BASE.arquivos && BASE.arquivos.length;
    if (!D) { escolher('novo'); return; }
    var corpo = '<div class="opcoes">' +
      (podeSomar ? '<button type="button" class="btn" data-m="somar"><b>Somar arquivos à base</b><span>Junta os arquivos novos (ex.: o mês que passou) ' + (BASE.arquivos.length === 1 ? 'ao arquivo já guardado' : 'aos ' + BASE.arquivos.length + ' já guardados') + '. A OM, a pendência e o consumo mais novos prevalecem.</span></button>' : '') +
      '<button type="button" class="btn" data-m="novo"><b>' + (podeSomar ? 'Começar do zero' : 'Escolher planilhas') + '</b><span>A base passa a ser só os arquivos escolhidos agora. Escolha juntos os de OMs, consumo e pendências (e de todos os anos).</span></button>' +
      (BASE ? '<button type="button" class="btn" data-m="apagar"><b>Apagar a base deste aparelho</b><span>Remove as planilhas guardadas aqui.</span></button>' : '') +
      '</div><p class="nota">Aceita a exportação do Manusis (.xlsx ou o .zip baixado) e a base única. A leitura é feita só neste aparelho; nada é enviado.</p>';
    var dr = gaveta('Atualizar base', 'Base atual: ' + fmtN.format(D.O.om.length) + ' OMs, de ' + dataBR(D.periodo[0]) + ' a ' + dataBR(D.periodo[1]), corpo);
    dr.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]'); if (!b) return;
      var m = b.getAttribute('data-m');
      if (m === 'apagar') {
        if (b.getAttribute('data-ok')) { guardar(null).then(function () { BASE = null; fecharFicha(); aviso('Base apagada deste aparelho.'); if (!DADOS) { D = null; telaInicial(); } }); }
        else { b.setAttribute('data-ok', '1'); b.querySelector('b').textContent = 'Toque de novo para confirmar'; }
        return;
      }
      escolher(m);
    });
  };
  document.addEventListener('dragover', function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); document.body.classList.add('arrastando'); } });
  document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('arrastando'); });
  document.addEventListener('drop', function (e) {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault(); document.body.classList.remove('arrastando');
    carregarArquivos(e.dataTransfer.files, BASE && BASE.arquivos && BASE.arquivos.length ? 'somar' : 'novo');
  });
  function telaInicial() {
    $('#periodo').textContent = 'Nenhuma base carregada neste aparelho';
    $('#filtros').innerHTML = ''; $('#ativos').innerHTML = '';
    $('#app').innerHTML = '<section class="card boas"><h2>Carregue as planilhas do Manusis</h2>' +
      '<ol><li>No Manusis, exporte as <b>Ordens de manutenção</b>, o <b>Consumo de materiais</b> e as <b>Pendências</b> (um ou mais anos).</li>' +
      '<li>Toque em <b>Escolher planilhas</b> e selecione todos os arquivos juntos (.xlsx ou o .zip baixado). A base única também serve.</li>' +
      '<li>Pronto: o painel cruza tudo pelo número da OM e guarda a base neste aparelho. No mês seguinte, use <b>Atualizar base</b>.</li></ol>' +
      '<div class="drop" id="drop"><span>Arraste as planilhas para cá</span><span class="nota">ou</span><button type="button" class="btn primary" id="btn-escolher">Escolher planilhas</button></div>' +
      '<p class="nota">A leitura é feita só neste aparelho. As planilhas não são enviadas para nenhum servidor.</p></section>';
    $('#btn-escolher').onclick = function () { escolher('novo'); };
  }
  function reiniciar(nd) {
    fecharFicha(); fecharPop();
    F.q = []; $('#q').value = ''; F.parque = {}; F.ativo = {}; F.ano = {}; F.mes = {}; F.status = {}; F.tipo = {}; F.falha = {}; F.material = null; matOMs = null; F.de = F.ate = '';
    UI.page = 0; UI.qf = 'todas'; MAPA = null;
    iniciar(nd);
  }

  function comecar() {
    var usarGuardado = function (alt) {
      return lerGuardado().then(function (g) {
        if (g && g.D && maisNovo(g.D, alt)) { BASE = g; iniciar(g.D); }
        else if (alt) iniciar(alt);
        else telaInicial();
      });
    };
    if (DADOS) return usarGuardado(DADOS);
    fetch('dados.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { return usarGuardado(d); }, function () { return usarGuardado(null); });
  }
  setTimeout(comecar, 0);
})();
</script>
